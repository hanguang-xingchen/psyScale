<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="开源,心理量表,心理测评,PHQ-9,GAD-7,SCL-90,免费,开源心理学工具">
  <meta name="description" content="psyScale — 开源的心理学多量表评估工具，支持 PHQ-9、GAD-7、SCL-90 等量表，即开即用，无需后端。">
  <title>psyScale — 开源心理学多量表评估</title>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1> psyScale </h1>
      <p>开源心理学多量表评估工具</p>
    </div>

    <div id="scale-list">
      <!-- 动态渲染量表卡片 -->
    </div>

    <div id="loading" class="empty-state">
      <div class="empty-state-icon">🌸</div>
      <p>正在加载量表…</p>
    </div>

    <div class="social-links">
      <a href="https://qm.qq.com/q/hxxcsAb5L4" target="_blank" rel="noopener" class="btn btn-social btn-qq">
        💬 抑郁症救救群
      </a>
      <a href="https://hanguangxingchen.top" target="_blank" rel="noopener" class="btn btn-social btn-author">
        👤 作者主页
      </a>
      <a href="https://github.com/hanguang-xingchen/psyScale" target="_blank" rel="noopener" class="btn btn-social btn-github">
        ⭐ Star 代码仓库
      </a>
    </div>
    <div class="star-prompt">⭐ 如果对你有帮助，欢迎在 GitHub 给个 Star</div>
  </div>

  <dialog id="resume-dialog" class="resume-dialog">
    <div class="resume-dialog-content">
      <div class="resume-dialog-icon">📝</div>
      <p class="resume-dialog-title">你有一个未完成的量表</p>
      <p class="resume-dialog-desc"><strong id="resume-scale-title"></strong></p>
      <p class="resume-dialog-time" id="resume-time"></p>
      <div class="resume-dialog-actions">
        <button id="btn-abandon" class="btn btn-secondary">放弃</button>
        <button id="btn-resume" class="btn btn-primary">继续答题</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/index.js?v=8"></script>
</body>
</html>
